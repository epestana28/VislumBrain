[project]
name = "vislumbrain"
version = "0.1.0"
description = "Prova de conceito: ver em que contexto cada neurónio de um modelo pequeno é usado."
requires-python = ">=3.11"
dependencies = ["torch>=2.4,<3", "transformers>=5,<6", "qdrant-client>=1.15,<2", "scikit-learn>=1.5,<2", "numpy>=2,<3"]

[project.scripts]
vislumbrain = "vislumbrain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
vislumbrain = ["web/*.html"]

[tool.setuptools.packages.find]
where = ["src"]
